<h2>Create Handover</h2>

<p>Resident: {{ resident.first_name }} {{ resident.last_name }} (Room {{ resident.room_number }})</p>

<form method="POST">
    {% csrf_token %}
    
    <p>
        <label for="id_shift">Shift:</label><br>
        {{ form.shift }}
    </p>
    
    <p>
        <label for="id_notes">Notes:</label><br>
        {{ form.notes }}
    </p>
    
    <button type="submit">Submit</button>
</form>

<a href="{% url 'resident_handovers' resident.id %}">Back to Handovers</a>
