{% extends "carehome/base.html" %}

{% block content %}
<h2>Create Handover for {{ resident.first_name }} {{ resident.last_name }}</h2>

<form method="post" class="mt-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Submit</button>
    <a class="btn btn-secondary" href="{% url 'resident_handovers' resident.id %}">Cancel</a>
</form>
{% endblock %}
