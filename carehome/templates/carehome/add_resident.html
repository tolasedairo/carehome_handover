{% extends "carehome/base.html" %}
{% block content %}

<div class="container mt-5">
  <div class="card shadow p-4 rounded-4">

    <h3 class="mb-4">Add Resident</h3>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}

      <button type="submit" class="btn btn-primary">
        Save Resident
      </button>

      <a href="{% url 'residents_list' %}" class="btn btn-secondary">
        Cancel
      </a>
    </form>

  </div>
</div>

{% endblock %}
