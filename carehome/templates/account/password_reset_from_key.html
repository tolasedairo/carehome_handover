{% extends "carehome/base.html" %}


{% block content %}
<div class="container mt-5">
    <h2>Set a New Password</h2>
    <p>Enter your new password below:</p>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary mt-3">Reset Password</button>
    </form>
</div>
{% endblock %}
